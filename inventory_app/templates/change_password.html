{% extends 'base.html' %}{% block title %}Change Password · Digital Inventory{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">MY ACCOUNT</p><h1>Change password</h1><p class="muted">Choose a password with at least 10 characters.</p></div></div>
<section class="panel form-panel"><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label><label>New password<input type="password" name="new_password" required minlength="10" autocomplete="new-password"></label><label>Confirm new password<input type="password" name="confirm_password" required minlength="10" autocomplete="new-password"></label><button class="button primary" type="submit">Save password</button></form></section>{% endblock %}
