{% extends 'base.html' %}{% block title %}Edit Product · Digital Inventory{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">{{ product.product_id }}</p><h1>Edit product</h1></div></div><section class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" value="{{ product.name }}" required maxlength="120"></label><label>Category<input name="category" value="{{ product.category }}" required maxlength="80"></label><label>Minimum quantity<input name="minimum_quantity" type="number" min="0" value="{{ product.minimum_quantity }}" required></label><label>Location<input name="location" value="{{ product.location }}" required maxlength="80"></label><label class="full">Description<textarea name="description" maxlength="500" rows="3">{{ product.description }}</textarea></label><div class="full button-row"><button class="button primary">Save changes</button><a class="button ghost" href="{{ url_for('main.product_detail',barcode=product.barcode) }}">Cancel</a></div></form></section>{% endblock %}
